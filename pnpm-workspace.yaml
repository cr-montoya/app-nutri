allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  # Transitive deps pinned deep inside next/prisma at vulnerable versions
  # (CVE-2026-33327/33328/35590/35591 for sharp; GHSA-6g55-p6wh-862q and
  # GHSA-r28c-9q8g-f849 for postcss; GHSA-ggr8-5vv4-36mx for deepmerge-ts).
  # `pnpm audit --audit-level=high` flagged these; none are direct
  # dependencies of this project, and none of the vulnerable code paths are
  # exercised (no next/image remote patterns, no untrusted CSS/source-map
  # input), but forcing the patched versions is cheap and removes the
  # finding rather than just documenting around it.
  sharp: '>=0.35.0'
  postcss: '>=8.5.18'
  deepmerge-ts: '>=8.0.0'
